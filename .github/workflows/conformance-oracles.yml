name: Conformance recordings

on:
  push:
    branches: [main]
    paths: ["packages/conformance/**"]
  pull_request:
    paths: ["packages/conformance/**"]

permissions:
  contents: read

concurrency:
  group: conformance-oracles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tlc:
    name: recordings match TLC ${{ matrix.shard }}/8
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: packages/conformance/.oracles/tla2tools.jar
          key: tlc-${{ hashFiles('packages/conformance/scripts/fetch-tlc.ts') }}
      - run: pnpm --filter @tla-ts/conformance fetch-tlc
      - run: pnpm --filter @tla-ts/conformance conformance --host tlc --shard ${{ matrix.shard }}/8
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tlc-results-${{ matrix.shard }}
          path: packages/conformance/.results/tlc.json

  typescript:
    name: recordings match Node and TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          # The recordings come from Node 24, which runs using declarations and newer built-ins.
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: packages/conformance/.oracles/typescript
          key: typescript-${{ hashFiles('packages/conformance/scripts/fetch-typescript.ts', 'packages/conformance/scripts/typescript.ts') }}
      - run: pnpm --filter @tla-ts/conformance fetch-typescript
      - run: pnpm --filter @tla-ts/conformance conformance --host typescript
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-results
          path: packages/conformance/.results/typescript.json
